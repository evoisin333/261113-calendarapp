<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="light dark">
  <title>Nous deux</title>

  <!-- Appli installable (étape 4) : fiche d'identité, icônes, couleur de la barre du téléphone -->
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="icones/icone-192.png" type="image/png">
  <link rel="apple-touch-icon" href="icones/icone-180.png">
  <meta name="apple-mobile-web-app-title" content="Nous deux">
  <meta name="theme-color" media="(prefers-color-scheme: light)" content="#F4F4F6">
  <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#15161A">

  <!-- FullCalendar 7.1.5 : styles (versions figées + empreintes) -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/fullcalendar@7.1.5/skeleton.css"
        integrity="sha384-ItZqDS1kQQr9PzsooRNf0mHsnqcOr9PfpKMJIOrePGfWbEaF3pH/EXosd+/k/fIz" crossorigin="anonymous">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/fullcalendar@7.1.5/themes/classic/theme.css"
        integrity="sha384-2aGV/VuChm9mQlrfCUhYe/ImdZfZ2Tg0Mjlzv1A37x/ggD+8cSR+3kd11Z0+S1KO" crossorigin="anonymous">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/fullcalendar@7.1.5/themes/classic/palette.css"
        integrity="sha384-0awbN7leMDXzyw9bchwFr3H6OMf5Nt1nJF6kyOm3IAsLFa0qH3Rh4G5u8wfC5b+A" crossorigin="anonymous">
  <!-- ?v=… : numéro de version, à changer à chaque mise à jour (sinon le téléphone garde l'ancien fichier) -->
  <link rel="stylesheet" href="style.css?v=2026-11-13-4b">
</head>
<body>

  <!-- Écran de connexion (affiché seulement si personne n'est connecté) -->
  <main id="ecran-connexion" hidden>
    <!-- L'icône : trois ronds pastel, Emma, Mattia et Nous -->
    <svg class="icone-appli" width="96" height="96" viewBox="0 0 96 96" role="img" aria-label="Nous deux">
      <rect width="96" height="96" rx="24" fill="#1E1F25"/>
      <circle cx="38" cy="40" r="20" fill="#F4B6C2"/>
      <circle cx="58" cy="40" r="20" fill="#B5DFC0" fill-opacity="0.92"/>
      <circle cx="48" cy="58" r="20" fill="#B3D4F2" fill-opacity="0.9"/>
    </svg>
    <h1>Nous deux</h1>
    <form id="formulaire-connexion">
      <label>E-mail
        <input type="email" id="champ-email" autocomplete="username" required>
      </label>
      <label>Mot de passe
        <input type="password" id="champ-mot-de-passe" autocomplete="current-password" required>
      </label>
      <button id="bouton-connexion">Se connecter</button>
      <p id="erreur-connexion" class="erreur"></p>
      <p class="note-connexion">Une seule fois : tu restes connecté·e ensuite.</p>
    </form>
  </main>

  <!-- L'appli -->
  <main id="ecran-appli" hidden>
    <header class="barre-haut">
      <div class="pilule">
        <button id="bouton-precedent" class="bouton-icone" aria-label="Précédent"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 18l-6-6 6-6"/></svg></button>
        <button id="bouton-suivant" class="bouton-icone" aria-label="Suivant"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 18l6-6-6-6"/></svg></button>
      </div>
      <span id="etat-synchro" title="Synchronisation" aria-hidden="true"></span>
      <div class="pilule">
        <button id="bouton-menu" class="bouton-icone" aria-label="Calendriers et compte"><svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="4" width="18" height="7" rx="2"/><rect x="3" y="14" width="18" height="6" rx="2"/></svg></button>
        <button id="bouton-recherche" class="bouton-icone" aria-label="Rechercher"><svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/></svg></button>
        <button id="bouton-ajouter" class="bouton-icone" aria-label="Nouvel événement"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg></button>
      </div>
    </header>
    <p id="bandeau-hors-ligne" role="status" hidden>Hors connexion · lecture seule</p>
    <h1 id="titre-periode"></h1>
    <div id="bande-semaine" class="bande-semaine" hidden></div>
    <p id="erreur-appli" class="erreur"></p>
    <div id="calendrier"></div>
    <footer class="barre-bas">
      <button id="bouton-aujourdhui" class="pilule pilule-texte">Aujourd'hui</button>
      <div class="pilule choix-vue">
        <button data-vue="resourceTimeGridDay">Jour</button>
        <button data-vue="timeGridWeek">Semaine</button>
        <button data-vue="dayGridMonth">Mois</button>
      </div>
    </footer>
    <p id="message" role="status" hidden></p>
  </main>

  <!-- Menu : calendriers affichés, affichage du mois, compte -->
  <dialog id="fenetre-menu" class="feuille">
    <div class="entete-feuille">
      <h2>Calendriers</h2>
      <button type="button" id="bouton-fermer-menu" class="bouton-clair">OK</button>
    </div>
    <div id="liste-calendriers" class="groupe"></div>
    <button type="button" id="bouton-tout-afficher" class="lien">Tout afficher</button>
    <div class="groupe">
      <label class="ligne-groupe">Mois détaillé (titres et heures)
        <input type="checkbox" id="champ-mois-detaille" class="interrupteur">
      </label>
    </div>
    <div class="groupe">
      <p class="ligne-groupe">Connecté·e <span id="prenom-connecte" class="discret"></span></p>
      <button type="button" id="bouton-deconnexion" class="ligne-groupe danger-texte">Se déconnecter de ce téléphone</button>
    </div>
  </dialog>

  <!-- Recherche -->
  <dialog id="fenetre-recherche">
    <div class="entete-recherche">
      <label class="champ-recherche"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/></svg>
        <input type="search" id="champ-recherche" placeholder="Titre, lieu, notes" autofocus
               autocomplete="off" enterkeyhint="search" aria-label="Rechercher">
      </label>
      <button type="button" id="bouton-fermer-recherche" class="discret">Fermer</button>
    </div>
    <div id="resultats-recherche"></div>
  </dialog>

  <!-- Formulaire d'un événement (création ou modification) -->
  <dialog id="fenetre-evenement">
    <form id="formulaire-evenement" method="dialog">
      <div class="entete-formulaire">
        <button type="button" id="bouton-annuler" class="discret">Annuler</button>
        <!-- autofocus sur le titre de la fenêtre : sinon le navigateur met le curseur dans le premier champ et le clavier s'ouvre -->
        <h2 id="titre-fenetre" tabindex="-1" autofocus>Nouvel événement</h2>
        <button type="button" id="bouton-enregistrer" class="bouton-clair">Enregistrer</button>
      </div>
      <p id="note-serie" class="note" hidden>🔁 Événement récurrent : les changements s'appliquent à toute la série (dates et heures de la série, pas de la date touchée).</p>

      <div class="groupe">
        <input id="champ-titre" placeholder="Titre" maxlength="200" autocomplete="off" aria-label="Titre">
        <input id="champ-lieu" placeholder="Lieu (facultatif)" maxlength="200" autocomplete="off" aria-label="Lieu">
      </div>

      <div id="choix-calendrier" class="choix-calendrier"></div>

      <div class="groupe">
      <label class="ligne-groupe">Journée entière
        <input type="checkbox" id="champ-journee" class="interrupteur">
      </label>

      <div class="ligne-date">
        <span>Début</span>
        <input type="date" id="champ-date-debut" required>
        <div class="roue-heure" id="roue-debut"></div>
      </div>
      <div class="ligne-date">
        <span>Fin</span>
        <input type="date" id="champ-date-fin" required>
        <div class="roue-heure" id="roue-fin"></div>
      </div>
      </div>

      <!-- Répétition -->
      <div class="groupe">
      <div class="ligne-champ">
        <span>Répétition</span>
        <select id="champ-repetition">
          <option value="">Jamais</option>
          <option value="DAILY">Chaque jour</option>
          <option value="WEEKLY">Chaque semaine</option>
          <option value="MONTHLY">Chaque mois (même date)</option>
          <option value="YEARLY">Chaque année</option>
        </select>
      </div>
      <div id="jours-semaine" class="jours-semaine" hidden></div>
      <div id="ligne-fin-repetition" class="ligne-champ" hidden>
        <span>Fin</span>
        <select id="champ-fin-repetition">
          <option value="">Pour toujours</option>
          <option value="date">Jusqu'au…</option>
        </select>
        <input type="date" id="champ-date-fin-repetition" hidden>
      </div>
      </div>

      <!-- Actions sur la date touchée (seulement pour une série) -->
      <div id="bloc-occurrence" class="bloc-occurrence" hidden>
        <p id="texte-occurrence"></p>
        <div class="boutons-formulaire">
          <button type="button" id="bouton-detacher">Détacher cette date</button>
          <button type="button" id="bouton-supprimer-date" class="danger">Supprimer cette date</button>
        </div>
      </div>

      <div class="groupe">
        <textarea id="champ-notes" placeholder="Notes (facultatif)" maxlength="2000" rows="3" aria-label="Notes"></textarea>
      </div>

      <p id="erreur-formulaire" class="erreur"></p>

      <button type="button" id="bouton-supprimer" class="danger-large">Supprimer</button>
    </form>
  </dialog>

  <!-- Configuration, puis bibliothèques (versions figées + empreintes). L'ordre compte. -->
  <script src="config.js?v=2026-11-13-4b"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.119.0/dist/umd/supabase.js"
          integrity="sha384-uteMfOloLDGt042uDz+xHGF3ym63/WQ6rFq7murQRG8Ih7QrXGEGNtWd8688sb4O" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/rrule@2.8.1/dist/es5/rrule.min.js"
          integrity="sha384-/841P5sCxcfR/THAcUhWr9d8zrIF1TPFzXRz8YhqxlPKvyL3tA/Ns4ytyfN5/hZh" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/fullcalendar@7.1.5/all/global.js"
          integrity="sha384-IAEKjDeCK3/9HPhmjC1YvDDk9EbeC1lVeUjvYs7Md/CFdLy4LwZms9CdSW/O6Fnn" crossorigin="anonymous"></script>
  <!-- FullCalendar Premium (vue jour en colonnes) : licence AGPLv3, voir le fichier LICENSE -->
  <script src="https://cdn.jsdelivr.net/npm/fullcalendar-scheduler@7.1.5/all/global.js"
          integrity="sha384-Xjohh1vs7Vn/fHtQ6X3VGzAR5B955wOPZXwD8QQnUD1EAxPrenPEjkXgkwUR67Cr" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/fullcalendar@7.1.5/themes/classic/global.js"
          integrity="sha384-aI9hlRxtPVjNaA6t2yaWlOugfU/NG08pEzMRAHoz0B8Y83dGcynbqRp1Baw8YIiR" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/fullcalendar@7.1.5/locales/fr/global.js"
          integrity="sha384-IoWWTl5788WGfhuiVj3pVNcO+keGpOmkklBgW51lS80OOxTWpCP3Y0rpwD5nuubf" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/@fullcalendar/rrule@7.1.5/global.js"
          integrity="sha384-qDlTn7aedGX/dP8oNjTvOY1u7rSJMmGFc1UylHS9Zed/AUc77adbybZF4jzd1L/6" crossorigin="anonymous"></script>
  <script src="app.js?v=2026-11-13-4b"></script>
</body>
</html>
