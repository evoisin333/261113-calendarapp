<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="light dark">
  <title>Calendrier</title>

  <!-- FullCalendar 7.1.5 : styles (versions figées + empreintes) -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/fullcalendar@7.1.5/skeleton.css"
        integrity="sha384-ItZqDS1kQQr9PzsooRNf0mHsnqcOr9PfpKMJIOrePGfWbEaF3pH/EXosd+/k/fIz" crossorigin="anonymous">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/fullcalendar@7.1.5/themes/classic/theme.css"
        integrity="sha384-2aGV/VuChm9mQlrfCUhYe/ImdZfZ2Tg0Mjlzv1A37x/ggD+8cSR+3kd11Z0+S1KO" crossorigin="anonymous">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/fullcalendar@7.1.5/themes/classic/palette.css"
        integrity="sha384-0awbN7leMDXzyw9bchwFr3H6OMf5Nt1nJF6kyOm3IAsLFa0qH3Rh4G5u8wfC5b+A" crossorigin="anonymous">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- Écran de connexion (affiché seulement si personne n'est connecté) -->
  <main id="ecran-connexion" hidden>
    <h1>📅 Calendrier</h1>
    <form id="formulaire-connexion">
      <label>E-mail
        <input type="email" id="champ-email" autocomplete="username" required>
      </label>
      <label>Mot de passe
        <input type="password" id="champ-mot-de-passe" autocomplete="current-password" required>
      </label>
      <button id="bouton-connexion">Se connecter</button>
      <p id="erreur-connexion" class="erreur"></p>
    </form>
  </main>

  <!-- L'appli -->
  <main id="ecran-appli" hidden>
    <header class="barre">
      <div id="filtres"></div>
      <span id="etat-synchro" title="Synchronisation">●</span>
      <button id="bouton-deconnexion" class="discret">Déconnexion</button>
    </header>
    <p id="erreur-appli" class="erreur"></p>
    <div id="calendrier"></div>
    <button id="bouton-ajouter" aria-label="Nouvel événement">+</button>
  </main>

  <!-- Formulaire d'un événement (création ou modification) -->
  <dialog id="fenetre-evenement">
    <form id="formulaire-evenement" method="dialog">
      <h2 id="titre-fenetre">Nouvel événement</h2>
      <p id="note-serie" class="note" hidden>🔁 Événement récurrent : les changements s'appliquent à toute la série.</p>

      <input id="champ-titre" placeholder="Titre" maxlength="200" autocomplete="off">

      <div id="choix-calendrier" class="choix-calendrier"></div>

      <label class="ligne-case">
        <input type="checkbox" id="champ-journee"> Journée entière
      </label>

      <div class="ligne-date">
        <span>Début</span>
        <input type="date" id="champ-date-debut" required>
        <div class="roue-heure" id="roue-debut"></div>
      </div>
      <div class="ligne-date">
        <span>Fin</span>
        <input type="date" id="champ-date-fin" required>
        <div class="roue-heure" id="roue-fin"></div>
      </div>

      <input id="champ-lieu" placeholder="Lieu (facultatif)" maxlength="200" autocomplete="off">
      <textarea id="champ-notes" placeholder="Notes (facultatif)" maxlength="2000" rows="3"></textarea>

      <p id="erreur-formulaire" class="erreur"></p>

      <div class="boutons-formulaire">
        <button type="button" id="bouton-supprimer" class="danger">Supprimer</button>
        <button type="button" id="bouton-annuler">Annuler</button>
        <button type="button" id="bouton-enregistrer" class="principal">Enregistrer</button>
      </div>
    </form>
  </dialog>

  <!-- Configuration, puis bibliothèques (versions figées + empreintes). L'ordre compte. -->
  <script src="config.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.119.0/dist/umd/supabase.js"
          integrity="sha384-uteMfOloLDGt042uDz+xHGF3ym63/WQ6rFq7murQRG8Ih7QrXGEGNtWd8688sb4O" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/rrule@2.8.1/dist/es5/rrule.min.js"
          integrity="sha384-/841P5sCxcfR/THAcUhWr9d8zrIF1TPFzXRz8YhqxlPKvyL3tA/Ns4ytyfN5/hZh" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/fullcalendar@7.1.5/all/global.js"
          integrity="sha384-IAEKjDeCK3/9HPhmjC1YvDDk9EbeC1lVeUjvYs7Md/CFdLy4LwZms9CdSW/O6Fnn" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/fullcalendar@7.1.5/themes/classic/global.js"
          integrity="sha384-aI9hlRxtPVjNaA6t2yaWlOugfU/NG08pEzMRAHoz0B8Y83dGcynbqRp1Baw8YIiR" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/fullcalendar@7.1.5/locales/fr/global.js"
          integrity="sha384-IoWWTl5788WGfhuiVj3pVNcO+keGpOmkklBgW51lS80OOxTWpCP3Y0rpwD5nuubf" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/@fullcalendar/rrule@7.1.5/global.js"
          integrity="sha384-qDlTn7aedGX/dP8oNjTvOY1u7rSJMmGFc1UylHS9Zed/AUc77adbybZF4jzd1L/6" crossorigin="anonymous"></script>
  <script src="app.js"></script>
</body>
</html>
