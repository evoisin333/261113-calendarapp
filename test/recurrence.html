<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Test récurrences et changement d'heure</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/fullcalendar@7.1.5/skeleton.css"
        integrity="sha384-ItZqDS1kQQr9PzsooRNf0mHsnqcOr9PfpKMJIOrePGfWbEaF3pH/EXosd+/k/fIz" crossorigin="anonymous">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/fullcalendar@7.1.5/themes/classic/theme.css"
        integrity="sha384-2aGV/VuChm9mQlrfCUhYe/ImdZfZ2Tg0Mjlzv1A37x/ggD+8cSR+3kd11Z0+S1KO" crossorigin="anonymous">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/fullcalendar@7.1.5/themes/classic/palette.css"
        integrity="sha384-0awbN7leMDXzyw9bchwFr3H6OMf5Nt1nJF6kyOm3IAsLFa0qH3Rh4G5u8wfC5b+A" crossorigin="anonymous">
  <style>
    body { font-family: system-ui, sans-serif; margin: 16px; max-width: 700px; }
    h2 { margin-top: 28px; font-size: 1.1em; }
    #verdicts li { margin: 6px 0; }
    .ok { color: #1b7f3b; }
    .ko { color: #b00020; font-weight: bold; }
    .utc { color: #777; font-size: 0.85em; }
  </style>
</head>
<body>
  <h1>Test : récurrences et changement d'heure</h1>
  <p>Fuseau de cet appareil : <strong id="fuseau-appareil"></strong>
     · fuseau du calendrier : <strong>Europe/Brussels</strong></p>

  <h2>✅ Verdict automatique</h2>
  <ul id="verdicts"><li>calcul en cours…</li></ul>

  <h2>🌸 Mars 2027 (heure d'été le dimanche 28 mars)</h2>
  <div id="cal-printemps"></div>

  <h2>🍂 Octobre–novembre 2027 (heure d'hiver le dimanche 31 octobre)</h2>
  <div id="cal-automne"></div>

  <!-- Bibliothèques, versions figées. L'ordre compte : rrule, puis FullCalendar, puis ses extensions -->
  <script src="https://cdn.jsdelivr.net/npm/rrule@2.8.1/dist/es5/rrule.min.js"
        integrity="sha384-/841P5sCxcfR/THAcUhWr9d8zrIF1TPFzXRz8YhqxlPKvyL3tA/Ns4ytyfN5/hZh" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/fullcalendar@7.1.5/all/global.js"
        integrity="sha384-IAEKjDeCK3/9HPhmjC1YvDDk9EbeC1lVeUjvYs7Md/CFdLy4LwZms9CdSW/O6Fnn" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/fullcalendar@7.1.5/themes/classic/global.js"
        integrity="sha384-aI9hlRxtPVjNaA6t2yaWlOugfU/NG08pEzMRAHoz0B8Y83dGcynbqRp1Baw8YIiR" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/fullcalendar@7.1.5/locales/fr/global.js"
        integrity="sha384-IoWWTl5788WGfhuiVj3pVNcO+keGpOmkklBgW51lS80OOxTWpCP3Y0rpwD5nuubf" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/@fullcalendar/rrule@7.1.5/global.js"
        integrity="sha384-qDlTn7aedGX/dP8oNjTvOY1u7rSJMmGFc1UylHS9Zed/AUc77adbybZF4jzd1L/6" crossorigin="anonymous"></script>
  <script>
    const FUSEAU = "Europe/Brussels";
    document.getElementById("fuseau-appareil").textContent =
      Intl.DateTimeFormat().resolvedOptions().timeZone;

    // Des lignes comme celles de la table evenements (instants en UTC)
    const lignes = [
      { id: 1, titre: "Sport (mardis 9h–10h)", journee_entiere: false,
        debut: "2027-03-02T08:00:00Z", fin: "2027-03-02T09:00:00Z",          // 9h–10h en hiver
        regle_recurrence: "FREQ=WEEKLY;BYDAY=TU;UNTIL=20271130T235959",
        dates_supprimees: ["2027-03-16"] },                                    // mardi 16 mars supprimé
      { id: 2, titre: "Soirée 22h → 3h (nuit du passage à l'heure d'été)", journee_entiere: false,
        debut: "2027-03-27T21:00:00Z", fin: "2027-03-28T01:00:00Z",          // 22h hiver → 3h été
        regle_recurrence: null, dates_supprimees: [] },
      { id: 3, titre: "Soirée 22h → 2h (nuit du retour à l'heure d'hiver)", journee_entiere: false,
        debut: "2027-10-30T20:00:00Z", fin: "2027-10-31T01:00:00Z",          // 22h été → 2h hiver
        regle_recurrence: null, dates_supprimees: [] },
      { id: 4, titre: "Anniversaire (journée entière, chaque année)", journee_entiere: true,
        date_debut: "2026-03-28", date_fin: "2026-03-29",
        regle_recurrence: "FREQ=YEARLY", dates_supprimees: [] },
      { id: 5, titre: "Vacances (journée entière, 3 jours)", journee_entiere: true,
        date_debut: "2027-10-30", date_fin: "2027-11-02",                    // 30, 31 oct. et 1er nov.
        regle_recurrence: null, dates_supprimees: [] },
    ];

    // Instant UTC -> "2027-03-02T09:00:00" à l'heure de Bruxelles (sans fuseau)
    // Astuce : le format suédois (sv-SE) écrit les dates comme l'ISO : "2027-03-02 09:00:00"
    function heureBruxelles(instant) {
      return new Intl.DateTimeFormat("sv-SE", {
        timeZone: FUSEAU, year: "numeric", month: "2-digit", day: "2-digit",
        hour: "2-digit", minute: "2-digit", second: "2-digit", hourCycle: "h23"
      }).format(new Date(instant)).replace(" ", "T");
    }

    // Une ligne de la base -> un événement FullCalendar
    function versFullCalendar(ligne) {
      const evenement = { id: String(ligne.id), title: ligne.titre };

      if (!ligne.regle_recurrence) {
        // Événement simple : FullCalendar convertit lui-même UTC -> Bruxelles
        evenement.allDay = ligne.journee_entiere;
        evenement.start = ligne.journee_entiere ? ligne.date_debut : ligne.debut;
        evenement.end = ligne.journee_entiere ? ligne.date_fin : ligne.fin;
        return evenement;
      }

      if (ligne.journee_entiere) {
        // Récurrence journée entière : des dates sans heure
        const jours = (new Date(ligne.date_fin) - new Date(ligne.date_debut)) / 86400000;
        evenement.rrule = `DTSTART:${ligne.date_debut.replaceAll("-", "")}\nRRULE:${ligne.regle_recurrence}`;
        evenement.duration = { days: jours };
        evenement.exdate = ligne.dates_supprimees;
      } else {
        // Récurrence à heure fixe : le départ est donné en heure de BRUXELLES, sans fuseau,
        // pour que la règle soit calculée en heure locale (9h reste 9h après le changement d'heure)
        const debutLocal = heureBruxelles(ligne.debut);              // "2027-03-02T09:00:00"
        const heureLocale = debutLocal.slice(11);                    // "09:00:00"
        evenement.rrule = `DTSTART:${debutLocal.replace(/[-:]/g, "")}\nRRULE:${ligne.regle_recurrence}`;
        evenement.duration = { milliseconds: new Date(ligne.fin) - new Date(ligne.debut) };
        evenement.exdate = ligne.dates_supprimees.map((date) => `${date}T${heureLocale}`);
      }
      return evenement;
    }

    const evenements = lignes.map(versFullCalendar);
    const occurrences = [];   // ce que FullCalendar affiche réellement, pour le verdict

    function creerCalendrier(idElement, dateDebut, dateFin) {
      const calendrier = new FullCalendar.Calendar(document.getElementById(idElement), {
        timeZone: FUSEAU,
        locale: "fr",
        initialView: "listePeriode",
        views: { listePeriode: { type: "list", visibleRange: { start: dateDebut, end: dateFin } } },
        headerToolbar: false,
        height: "auto",
        events: evenements,
        eventDidMount: (info) => {
          occurrences.push({ id: info.event.id, debut: info.event.start, fin: info.event.end,
                             journee: info.event.allDay });
          // Affiche aussi l'instant UTC à côté, pour voir le décalage changer
          if (!info.event.allDay) {
            const ligneUtc = document.createElement("span");
            ligneUtc.className = "utc";
            ligneUtc.textContent = ` (UTC ${info.event.start.toISOString().slice(11, 16)})`;
            info.el.querySelector("a, [class*='title']")?.append(ligneUtc) ?? info.el.append(ligneUtc);
          }
        }
      });
      calendrier.render();
    }

    creerCalendrier("cal-printemps", "2027-03-08", "2027-04-08");
    creerCalendrier("cal-automne", "2027-10-18", "2027-11-10");

    // Verdict : on compare ce qui est affiché à ce qu'on attend
    function verifier() {
      const resultats = [];
      const ajouter = (ok, texte) => resultats.push({ ok, texte });
      const sport = occurrences.filter((o) => o.id === "1");
      const heures = sport.map((o) => heureBruxelles(o.debut).slice(11, 16));
      const datesSport = sport.map((o) => heureBruxelles(o.debut).slice(0, 10));

      ajouter(sport.length > 0 && heures.every((h) => h === "09:00"),
        `Sport toujours à 9h00 (heure de Bruxelles) : ${[...new Set(heures)].join(", ") || "aucune occurrence"}`);
      ajouter(!datesSport.includes("2027-03-16") && datesSport.includes("2027-03-09") && datesSport.includes("2027-03-23"),
        "Mardi 16 mars supprimé, 9 et 23 mars présents");
      ajouter(datesSport.includes("2027-03-30") && datesSport.includes("2027-11-02"),
        "Occurrences présentes après chaque changement d'heure (30 mars, 2 novembre)");

      const soireePrintemps = occurrences.find((o) => o.id === "2");
      ajouter(soireePrintemps &&
        heureBruxelles(soireePrintemps.debut) === "2027-03-27T22:00:00" &&
        heureBruxelles(soireePrintemps.fin) === "2027-03-28T03:00:00",
        "Soirée de mars : 27/03 22h00 → 28/03 3h00");
      const soireeAutomne = occurrences.find((o) => o.id === "3");
      ajouter(soireeAutomne &&
        heureBruxelles(soireeAutomne.debut) === "2027-10-30T22:00:00" &&
        heureBruxelles(soireeAutomne.fin) === "2027-10-31T02:00:00",
        "Soirée d'octobre : 30/10 22h00 → 31/10 2h00");

      const anniv = occurrences.find((o) => o.id === "4");
      ajouter(anniv && anniv.journee && heureBruxelles(anniv.debut).slice(0, 10) === "2027-03-28",
        "Anniversaire le 28 mars 2027, en journée entière");
      const vacances = occurrences.filter((o) => o.id === "5");
      ajouter(vacances.length > 0 && vacances.every((o) => o.journee),
        "Vacances du 30 octobre au 1er novembre, en journée entière");

      document.getElementById("verdicts").innerHTML = "";
      for (const { ok, texte } of resultats) {
        const li = document.createElement("li");
        li.className = ok ? "ok" : "ko";
        li.textContent = `${ok ? "✅" : "❌"} ${texte}`;
        document.getElementById("verdicts").append(li);
      }
    }
    setTimeout(verifier, 500);
  </script>
</body>
</html>
